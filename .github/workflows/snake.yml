name: Generate Profile Visuals

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish profile visuals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare generated assets
        run: mkdir -p dist/profile

      - name: Generate contribution snake assets
        uses: Platane/snk@v3
        with:
          github_user_name: Srikar-Bharadwaj
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232563EB&color_dots=%23EBEDF0,%2393C5FD,%2360A5FA,%232563EB,%231D4ED8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2367E8F9
            dist/github-contribution-grid-snake.gif?color_snake=%2367E8F9&color_dots=%230B1220,%231E293B,%23334155,%234F46E5,%2306B6D4

      - name: Generate static GitHub statistics
        uses: cicirello/user-statistician@v1
        with:
          image-file: dist/profile/github-stats.svg
          include-title: true
          custom-title: GitHub Engineering Snapshot
          small-title: false
          featured-repository: FleetOps
          max-languages: 6
          language-repository-exclusions: ""
          animated-language-chart: false
          top-icon: github
          colors: dark-dimmed
          border-radius: 10
          show-border: true
          image-width: 980
          hide-keys: "sponsors sponsoring"
          category-order: general, repositories, contributions, languages
          locale: en
          fail-on-error: true
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg
          test -s dist/profile/github-stats.svg
          test -s dist/github-contribution-grid-snake.gif
          echo "Generated assets:"
          find dist -maxdepth 2 -type f -print

      - name: Publish assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
