name: Generate Snake

on:
  schedule:
    # Refresh the contribution animation once per day.
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# The workflow only writes generated assets to the output branch.
permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution animations
        uses: Platane/snk@v3
        with:
          github_user_name: Srikar-Bharadwaj
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=22D3EE&color_dots=0:0B1220,25:1E293B,50:334155,75:6366F1,100:22D3EE

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
